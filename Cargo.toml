[package]
name = "spheradian"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Spherical 3D desktop environment prototype in safe Rust and wgpu, designed around explicit trust domains"
license = "Apache-2.0"
repository = "https://github.com/spheradian/spheradian"
readme = "README.md"
keywords = ["desktop-environment", "compositor", "wgpu", "wayland", "security"]
categories = ["graphics", "gui", "rendering"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
empty_drop = "deny"
exit = "deny"
fallible_impl_from = "deny"
fn_to_numeric_cast_any = "deny"
infinite_loop = "deny"
large_stack_arrays = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mutex_atomic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_mutex = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.34"
log = "0.4"
wgpu = "30.0"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1.0"

# Browser build of the demo (see `scripts/build-web.sh`): WebGPU with a WebGL2 fallback.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "Window"] }
web-time = "1.1"
wgpu = { version = "30.0", features = ["webgl"] }

# Hardened compilation profiles (inspired by secureblue / GrapheneOS / Hardened Gentoo)
[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
strip = "symbols"
