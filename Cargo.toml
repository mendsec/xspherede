[package]
name = "xspherede"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Spherical 3D desktop environment prototype in safe Rust and wgpu, designed around explicit trust domains"
license = "MIT"
repository = "https://github.com/mendsec/xspherede"
homepage = "https://github.com/mendsec/xspherede"
readme = "README.md"
keywords = ["desktop-environment", "compositor", "wgpu", "wayland", "security"]
categories = ["graphics", "gui", "rendering"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
env_logger = "0.11"
glam = "0.29"
log = "0.4"
pollster = "0.4"
wgpu = "30.0"
winit = "0.30"

# Hardened compilation profiles (inspired by secureblue / GrapheneOS / Hardened Gentoo)
[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
strip = "symbols"
