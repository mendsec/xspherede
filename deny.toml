# cargo-deny policy configuration for Spheradian.
# Enforces dependency advisories, MIT-compatible licensing, crate bans, and allowed sources.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Vulnerability advisories fail the check by default in modern cargo-deny.
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
# Permissive SPDX licenses compatible with this project's Apache-2.0 license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
